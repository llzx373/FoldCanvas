name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 可选：配置 secrets 后签名 release APK（未配置则产出未签名包）
      - name: Decode keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug
        env:
          FOLDCANVAS_STORE_FILE: ${{ runner.temp }}/release.keystore
          FOLDCANVAS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FOLDCANVAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FOLDCANVAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Extract tag message as release notes
        run: |
          # 浅克隆下 tag ref 被剥离为直接指向 commit，需显式拉取 tag 对象
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/FoldCanvas-*-release.apk
            app/build/outputs/apk/debug/FoldCanvas-*-debug.apk

      # action-gh-release 对已有 release 不会更新正文，用 gh 强制覆盖
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
