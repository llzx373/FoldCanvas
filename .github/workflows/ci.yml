name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Duo preview e2e (blur pyramid math)
        run: |
          python tools/duo_preview/generate_duo.py
          python tools/duo_preview/e2e_check.py

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Wings preview e2e (panel animation math)
        run: |
          python tools/wings_preview/generate_wings.py
          python tools/wings_preview/e2e_check.py

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FoldCanvas-debug-apk
          path: app/build/outputs/apk/debug/FoldCanvas-*-debug.apk
          retention-days: 14
